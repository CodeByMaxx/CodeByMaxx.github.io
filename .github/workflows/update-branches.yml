name: Update GitHub Branch List

on:
  push:
  schedule:
    - cron: "0 */6 * * *"

jobs:

  update-branches:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Generate branch list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          mkdir -p assets

          gh api \
          --paginate \
          /user/repos \
          -f visibility=public \
          -f affiliation=owner \
          --jq '
          [
            .[] |
            select(.fork == false) |
            {
              repository: .name,
              branches:
              (
                [
                  (
                    gh api \
                    /repos/\(.owner.login)/\(.name)/branches \
                    --jq ".[].name"
                  )
                ]
                | map(select(. != "main" and . != "master" and . != "develop"))
              )
            }
            | select(.branches | length > 0)
          ]
          ' > assets/branches.json



      - name: Commit changes

        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add assets/branches.json

          git commit -m "Update branch list" || exit 0

          git push
